name: Build by Coin APK v0.1
on:
  push:
    branches: [build-by-coin-apk-v0.1]
    paths:
      - 'build-by-coin/apk/**'
      - '.github/workflows/build-by-coin-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: build-by-coin/apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BuildByCoin-v0.1-debug
          path: build-by-coin/apk/app/build/outputs/apk/debug/app-debug.apk
